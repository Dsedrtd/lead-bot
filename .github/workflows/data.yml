name: Обновить списки

on:
  schedule:
    - cron: '0 1 * * *'   # каждый день в 04:00 по Москве
  workflow_dispatch:       # кнопка «Run workflow» на GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-data.mjs
      - name: Сохранить данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898579+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Обновить списки $(date +%F)"
          git push
